    Experience:
      - company: Xi'an Jiaotong University
        position: Research Intern
        location: Xi'an, China
        start_date: 2026-07
        end_date: present
        summary: Magnetically Steerable Catheter System for Industrial Inspection, Prof. Qiji Ze's group.
        highlights:
          - Designed a passive reel-and-guide mechanism in SolidWorks for compact storage of excess spring-sheathed magnetic catheter while preserving minimum bend radius.
          - Designed and fabricated the reel, entry guide, catheter groove, and interfaces with the existing drive module for compact packaging and low-friction motion.
          - Developed benchtop advance and retract tests for automatic take-up, smooth release, jamming, groove escape, resistance, and bend-radius compliance.

      - company: The Chinese University of Hong Kong
        position: Research Assistant
        location: Hong Kong SAR
        start_date: 2026-06
        end_date: 2026-07
        summary: Magnetically Steerable Micro-Camera Catheter for Bronchial-Tree Phantom Navigation; advisor, Prof. Hongliang Ren.
        highlights:
          - Designed and fabricated a millimeter-scale catheter integrating an LED micro-camera, a 0.2-mm nitinol support, heat-shrink encapsulation, and a hard-magnetic Ecoflex cuff.
          - Built insertion-force and steering-characterization setups and completed bronchial-tree phantom navigation experiments.
          - Demonstrated multidirectional magnetic steering and forward-looking intraluminal imaging; led manuscript preparation as co-first author.

      - company: ETH Zurich, Multi-Scale Robotics Lab
        position: Semester Project Researcher
        location: Zurich, Switzerland
        start_date: 2026-03
        end_date: 2026-06
        summary: Soft Miniaturized Intraductal Imaging Catheter; supervisor, Prof. Bradley Nelson.
        highlights:
          - Designed and fabricated sub-millimeter imaging catheters using 0.5-mm and 0.7-mm nitinol supports.
          - Built a four-load-cell force platform with Arduino and Python data acquisition and compared prototypes with a 1.1-mm rigid reference.
          - Identified the 0.5-mm silicone-covered design as the lowest-force configuration and demonstrated imaging in a silicone breast-duct phantom.

      - company: The Chinese University of Hong Kong
        position: Research Assistant
        location: Hong Kong SAR
        start_date: 2025-09
        end_date: present
        summary: Polymer Material-Based Jumping Robot; advisor, Prof. Hongliang Ren.
        highlights:
          - Designed and fabricated an Arduino-controlled pneumatic jumping robot using a double-layer spherical-cap silicone actuator.
          - Modeled actuator geometry and evaluated material stiffness and inflation-release cycles against jump height, frequency, and repeatability.

      - company: The Chinese University of Hong Kong
        position: Research Assistant
        location: Hong Kong SAR
        start_date: 2025-06
        end_date: 2025-08
        summary: Bioinspired Kirigami Capsule Robot for Minimally Invasive Gastrointestinal Biopsy; advisor, Prof. Hongliang Ren.
        highlights:
          - Developed A4988-based motor-control electronics and Arduino pulse-control software for a 17-mm biopsy capsule.
          - Built an angular calibration platform yielding approximately 18.1 degrees per pulse and R-squared of 0.99.
          - Conducted ex vivo biopsy experiments and analyzed penetration, interaction-force, and tissue-yield data for the accepted ICRA 2026 paper.

